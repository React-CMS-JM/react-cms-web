# Deploy the Vite SPA to Cloudflare Workers (static assets + SPA routing).
#
# Required GitHub repository secrets:
#   CLOUDFLARE_API_TOKEN   — API token with Account → Workers Scripts:Edit
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account ID (dashboard → Workers overview)
#
# Optional repository Variables (override .env.production if set):
#   VITE_AUTH_API_URL
#   VITE_CONTENT_API_URL
#   VITE_COURSES_API_URL
#
# Targets:
#   main → Worker "react-cms-web"
#   dev  → Worker "react-cms-web-dev"

name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SPA
        # Vite loads committed `.env.production` (Cloud Run API bases).
        # Set repository Variables with the same names to override at build time.
        env:
          VITE_AUTH_API_URL: ${{ vars.VITE_AUTH_API_URL }}
          VITE_CONTENT_API_URL: ${{ vars.VITE_CONTENT_API_URL }}
          VITE_COURSES_API_URL: ${{ vars.VITE_COURSES_API_URL }}
        run: |
          # Empty GitHub Variables would override .env.production — only export when set.
          if [ -z "$VITE_AUTH_API_URL" ]; then unset VITE_AUTH_API_URL; fi
          if [ -z "$VITE_CONTENT_API_URL" ]; then unset VITE_CONTENT_API_URL; fi
          if [ -z "$VITE_COURSES_API_URL" ]; then unset VITE_COURSES_API_URL; fi
          npm run build

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: ${{ github.ref_name == 'dev' && 'deploy --env dev' || 'deploy --env=""' }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm

      - name: Deployment URL
        if: steps.deploy.outputs.deployment-url != ''
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}"
