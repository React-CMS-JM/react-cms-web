# One-shot: remove the react-cms-web Worker and publish react-go-cms-web.
# Delete this workflow after it succeeds.

name: Replace frontend Worker

on:
  workflow_dispatch:

jobs:
  replace:
    name: Undeploy old Worker and deploy react-go-cms-web
    runs-on: ubuntu-latest
    steps:
      - name: Copy Cloudflare secrets to react-go-cms-web
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          gh secret set CLOUDFLARE_API_TOKEN --repo React-CMS-JM/react-go-cms-web --body "$CLOUDFLARE_API_TOKEN"
          gh secret set CLOUDFLARE_ACCOUNT_ID --repo React-CMS-JM/react-go-cms-web --body "$CLOUDFLARE_ACCOUNT_ID"

      - name: Delete react-cms-web Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: delete react-cms-web --force
          packageManager: npm

      - name: Checkout react-go-cms-web
        uses: actions/checkout@v4
        with:
          repository: React-CMS-JM/react-go-cms-web
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SPA
        run: npm run build

      - name: Deploy react-go-cms-web
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm
