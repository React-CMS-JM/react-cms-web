name: Cleanup staging Worker (one-shot)

on:
  workflow_dispatch:

jobs:
  delete-dev-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Delete react-cms-web-dev
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: delete react-cms-web-dev --force
          packageManager: npm
